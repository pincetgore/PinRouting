name: Update Routing Configs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
      - ".github/dependabot.yml"
  repository_dispatch:
    types: [update-routing-configs]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      happ_default: ${{ steps.deeplinks.outputs.happ_default }}
      happ_whitelist: ${{ steps.deeplinks.outputs.happ_whitelist }}
      happ_json: ${{ steps.deeplinks.outputs.happ_json }}
      incy_default: ${{ steps.deeplinks.outputs.incy_default }}
      incy_whitelist: ${{ steps.deeplinks.outputs.incy_whitelist }}
      incy_json: ${{ steps.deeplinks.outputs.incy_json }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate configs
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating JSON files..."
          jq empty HAPP/*.JSON INCY/*.JSON
          echo "All configs valid!"

      - name: Update routing configs
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC

          GEOIP_REPO="hydraponique/roscomvpn-geoip"
          GEOSITE_REPO="hydraponique/roscomvpn-geosite"

          latest_tag() {
            git ls-remote --tags "https://github.com/${1}.git" \
              | awk '{print $2}' \
              | sed -E 's@refs/tags/@@; s@\^\{\}@@' \
              | grep -E '^[0-9]{12}$' \
              | sort -r \
              | head -n 1
          }

          current_geoip_tag="$(jq -r '.Geoipurl | capture("@(?<tag>[0-9]{12})/") | .tag' HAPP/DEFAULT.JSON 2>/dev/null || true)"
          current_geosite_tag="$(jq -r '.Geositeurl | capture("@(?<tag>[0-9]{12})/") | .tag' HAPP/DEFAULT.JSON 2>/dev/null || true)"

          geoip_tag="$(latest_tag "$GEOIP_REPO")"
          geosite_tag="$(latest_tag "$GEOSITE_REPO")"
          [[ -n "$geoip_tag" && -n "$geosite_tag" ]]

          echo "Current GeoIP tag:   ${current_geoip_tag:-none}, Latest: $geoip_tag"
          echo "Current Geosite tag: ${current_geosite_tag:-none}, Latest: $geosite_tag"

          if [[ "$current_geoip_tag" != "$geoip_tag" || "$current_geosite_tag" != "$geosite_tag" ]]; then
            now_epoch="$(date -u +%s)"
            geoip_url="https://cdn.jsdelivr.net/gh/${GEOIP_REPO}@${geoip_tag}/release/geoip.dat"
            geosite_url="https://cdn.jsdelivr.net/gh/${GEOSITE_REPO}@${geosite_tag}/release/geosite.dat"

            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geoip_url" >/dev/null
            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geosite_url" >/dev/null

            for dir in HAPP INCY; do
              for type in DEFAULT WHITELIST JSONSUB; do
                file="${dir}/${type}.JSON"
                tmp="$(mktemp)"
                jq \
                  --arg ts "$now_epoch" \
                  --arg geoip "$geoip_url" \
                  --arg geosite "$geosite_url" \
                  '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
                  "$file" > "$tmp"
                mv "$tmp" "$file"
              done
            done
          fi

          for type in DEFAULT WHITELIST JSONSUB; do
            happ_b64="$(jq -c . "HAPP/${type}.JSON" | tr -d '\r\n' | base64 | tr -d '\r\n')"
            printf 'happ://routing/onadd/%s\n' "$happ_b64" > "HAPP/${type}.DEEPLINK"

            incy_b64="$(jq -c . "INCY/${type}.JSON" | tr -d '\r\n' | base64 | tr -d '\r\n')"
            printf 'incy://routing/onadd/%s\n' "$incy_b64" > "INCY/${type}.DEEPLINK"
          done

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add HAPP/ INCY/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update routing configs [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Export deeplinks
        id: deeplinks
        shell: bash
        run: |
          echo "happ_default=$(tr -d '\n\r' < HAPP/DEFAULT.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "happ_whitelist=$(tr -d '\n\r' < HAPP/WHITELIST.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "happ_json=$(tr -d '\n\r' < HAPP/JSONSUB.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "incy_default=$(tr -d '\n\r' < INCY/DEFAULT.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "incy_whitelist=$(tr -d '\n\r' < INCY/WHITELIST.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "incy_json=$(tr -d '\n\r' < INCY/JSONSUB.DEEPLINK)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to servers
        shell: bash
        env:
          HAPP_DEFAULT: ${{ needs.update.outputs.happ_default }}
          HAPP_WHITELIST: ${{ needs.update.outputs.happ_whitelist }}
          HAPP_JSON: ${{ needs.update.outputs.happ_json }}
          INCY_DEFAULT: ${{ needs.update.outputs.incy_default }}
          INCY_WHITELIST: ${{ needs.update.outputs.incy_whitelist }}
          INCY_JSON: ${{ needs.update.outputs.incy_json }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SERVERS: ${{ secrets.DEPLOY_SERVERS }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_SERVERS:-}" || -z "${DEPLOY_SSH_KEY:-}" ]]; then
            echo "DEPLOY_SERVERS or DEPLOY_SSH_KEY is not configured. Skipping deployment."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/deploy_key"

          IFS=',' read -ra SERVERS <<< "$DEPLOY_SERVERS"

          TOTAL=${#SERVERS[@]}
          FAIL_COUNT=0

          for i in "${!SERVERS[@]}"; do
            SRV_NUM=$((i + 1))
            SERVER="$(echo "${SERVERS[$i]}" | xargs)"

            set +e
            RESULT=$(ssh $SSH_OPTS "$SERVER" bash -s -- \
              "$HAPP_DEFAULT" "$HAPP_WHITELIST" "$HAPP_JSON" \
              "$INCY_DEFAULT" "$INCY_WHITELIST" "$INCY_JSON" 2>&1 <<'REMOTE_SCRIPT'
              set -euo pipefail

              HAPP_DEFAULT="$1"; HAPP_WHITELIST="$2"; HAPP_JSON="$3"
              INCY_DEFAULT="$4"; INCY_WHITELIST="$5"; INCY_JSON="$6"

              ACTIONS=""

              # --- Geofiles ---
              if [ -d /opt/remnanode ]; then
                TARGET=/opt/remnanode
              elif [ -d /opt/remnawave/node ]; then
                TARGET=/opt/remnawave/node
              else
                TARGET=""
              fi

              if [ -n "$TARGET" ]; then
                NEED_RESTART=false

                REMOTE_GEOIP_SHA=$(curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused "https://github.com/hydraponique/roscomvpn-geoip/releases/latest/download/geoip.dat.sha256" | awk '{print $1}')
                REMOTE_GEOSITE_SHA=$(curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused "https://github.com/hydraponique/roscomvpn-geosite/releases/latest/download/geosite.dat.sha256" | awk '{print $1}')

                if [ -f "$TARGET/geoip.dat" ]; then
                  LOCAL_GEOIP_SHA=$(sha256sum "$TARGET/geoip.dat" | awk '{print $1}')
                else
                  LOCAL_GEOIP_SHA=""
                fi

                if [ -f "$TARGET/geosite.dat" ]; then
                  LOCAL_GEOSITE_SHA=$(sha256sum "$TARGET/geosite.dat" | awk '{print $1}')
                else
                  LOCAL_GEOSITE_SHA=""
                fi

                if [ -n "$REMOTE_GEOIP_SHA" ] && [ "$REMOTE_GEOIP_SHA" != "$LOCAL_GEOIP_SHA" ]; then
                  sudo curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o "$TARGET/geoip.dat" "https://github.com/hydraponique/roscomvpn-geoip/releases/latest/download/geoip.dat"
                  sudo chmod 644 "$TARGET/geoip.dat"
                  NEED_RESTART=true
                  ACTIONS="${ACTIONS}geoip.dat "
                fi

                if [ -n "$REMOTE_GEOSITE_SHA" ] && [ "$REMOTE_GEOSITE_SHA" != "$LOCAL_GEOSITE_SHA" ]; then
                  sudo curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o "$TARGET/geosite.dat" "https://github.com/hydraponique/roscomvpn-geosite/releases/latest/download/geosite.dat"
                  sudo chmod 644 "$TARGET/geosite.dat"
                  NEED_RESTART=true
                  ACTIONS="${ACTIONS}geosite.dat "
                fi

                if [ "$NEED_RESTART" = true ]; then
                  cd "$TARGET"
                  sudo docker compose restart || sudo docker compose up -d
                  cd /
                fi
              fi

              # --- Nginx ---
              if [ -f /etc/nginx/sites-available/default ] && [ -f /etc/nginx/sites-available/incy.conf ]; then
                NGINX_CHANGED=false

                update_config() {
                  local FILE="$1" DEF="$2" WL="$3" JS="$4"
                  local TMP=$(mktemp)
                  awk -v def="$DEF" -v wl="$WL" -v js="$JS" '
                    /location = \/[[:space:]]*$/ { loc="default" }
                    /location = \/whitelist/ { loc="whitelist" }
                    /location = \/json/ { loc="json" }
                    /rewrite \// {
                      if (loc == "default") { sub(/rewrite \/.*redirect;/, "rewrite / " def " redirect;"); loc="" }
                      else if (loc == "whitelist") { sub(/rewrite \/.*redirect;/, "rewrite / " wl " redirect;"); loc="" }
                      else if (loc == "json") { sub(/rewrite \/.*redirect;/, "rewrite / " js " redirect;"); loc="" }
                    }
                    { print }
                  ' "$FILE" > "$TMP"

                  if ! cmp -s "$FILE" "$TMP"; then
                    sudo mv "$TMP" "$FILE"
                    sudo chmod 644 "$FILE"
                    NGINX_CHANGED=true
                  else
                    rm -f "$TMP"
                  fi
                }

                update_config /etc/nginx/sites-available/default "$HAPP_DEFAULT" "$HAPP_WHITELIST" "$HAPP_JSON"
                update_config /etc/nginx/sites-available/incy.conf "$INCY_DEFAULT" "$INCY_WHITELIST" "$INCY_JSON"

                if [ "$NGINX_CHANGED" = true ]; then
                  if sudo nginx -t >/dev/null 2>&1; then
                    sudo systemctl reload nginx 2>/dev/null || sudo service nginx reload 2>/dev/null || sudo service nginx restart
                    ACTIONS="${ACTIONS}nginx "
                  else
                    echo "nginx config test failed!" >&2
                  fi
                fi
              fi

              # --- Result ---
              if [ -z "$ACTIONS" ]; then
                echo "up to date"
              else
                echo "updated ${ACTIONS% }"
              fi
          REMOTE_SCRIPT
            )
            ssh_exit=$?
            set -e

            RESULT=$(echo "$RESULT" | tail -1)

            if [ $ssh_exit -ne 0 ]; then
              echo "SRV${SRV_NUM} - FAIL (connection error)"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            elif echo "$RESULT" | grep -q "^updated"; then
              FILES=$(echo "$RESULT" | sed 's/^updated //')
              echo "SRV${SRV_NUM} - OK (updated $FILES)"
            else
              echo "SRV${SRV_NUM} - OK (up to date)"
            fi
          done

          rm -f ~/.ssh/deploy_key

          if [ $FAIL_COUNT -gt 0 ]; then
            echo "Failed: $FAIL_COUNT/$TOTAL servers"
            exit 1
          fi
