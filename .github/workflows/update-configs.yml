name: Update Routing Configs

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Принудительно обновить (LastUpdated и диплинки)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  repository_dispatch:
    types: [update-routing-configs]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate configs
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating JSON files..."
          jq empty HAPP/*.JSON INCY/*.JSON
          echo "All configs valid!"

      - name: Update routing configs
        shell: bash
        env:
          FORCE_UPDATE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          export TZ=UTC

          GEOIP_REPO="hydraponique/roscomvpn-geoip"
          GEOSITE_REPO="hydraponique/roscomvpn-geosite"

          latest_tag() {
            git ls-remote --tags "https://github.com/${1}.git" \
              | awk '{print $2}' \
              | sed -E 's@refs/tags/@@; s@\^\{\}@@' \
              | grep -E '^[0-9]{12}$' \
              | sort -r \
              | head -n 1
          }

          geoip_tag="$(latest_tag "$GEOIP_REPO")"
          geosite_tag="$(latest_tag "$GEOSITE_REPO")"
          [[ -n "$geoip_tag" && -n "$geosite_tag" ]]

          echo "Latest GeoIP tag:   $geoip_tag"
          echo "Latest Geosite tag: $geosite_tag"

          FORCE_UPDATE="${FORCE_UPDATE:-false}"
          need_update=false

          if [[ "$FORCE_UPDATE" == "true" ]]; then
            need_update=true
            echo "Force update enabled: will update LastUpdated and deeplinks"
          fi

          for type in DEFAULT WHITELIST JSONSUB; do
            file="HAPP/${type}.JSON"
            f_geoip="$(jq -r '.Geoipurl | capture("@(?<tag>[0-9]{12})/") | .tag' "$file" 2>/dev/null || true)"
            f_geosite="$(jq -r '.Geositeurl | capture("@(?<tag>[0-9]{12})/") | .tag' "$file" 2>/dev/null || true)"
            if [[ "$f_geoip" != "$geoip_tag" || "$f_geosite" != "$geosite_tag" ]]; then
              need_update=true
              echo "$file needs tag update (current geoip: ${f_geoip:-none}, geosite: ${f_geosite:-none})"
            fi
          done

          if [[ "$need_update" == "true" ]]; then
            now_epoch="$(date -u +%s)"
            geoip_url="https://cdn.jsdelivr.net/gh/${GEOIP_REPO}@${geoip_tag}/release/geoip.dat"
            geosite_url="https://cdn.jsdelivr.net/gh/${GEOSITE_REPO}@${geosite_tag}/release/geosite.dat"

            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geoip_url" >/dev/null
            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geosite_url" >/dev/null

            for type in DEFAULT WHITELIST JSONSUB; do
              file="HAPP/${type}.JSON"
              tmp="$(mktemp)"
              jq \
                --arg ts "$now_epoch" \
                --arg geoip "$geoip_url" \
                --arg geosite "$geosite_url" \
                '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
                "$file" > "$tmp"
              mv "$tmp" "$file"
            done
          fi

          echo "Mirroring HAPP configs to INCY..."
          cp HAPP/*.JSON INCY/

          for type in DEFAULT WHITELIST JSONSUB; do
            happ_b64="$(jq -c . "HAPP/${type}.JSON" | tr -d '\r\n' | base64 | tr -d '\r\n')"
            printf 'happ://routing/onadd/%s\n' "$happ_b64" > "HAPP/${type}.DEEPLINK"

            incy_b64="$(jq -c . "INCY/${type}.JSON" | tr -d '\r\n' | base64 | tr -d '\r\n')"
            printf 'incy://routing/onadd/%s\n' "$incy_b64" > "INCY/${type}.DEEPLINK"
          done

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add HAPP/ INCY/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update routing configs [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git pull --rebase origin main
          git push
