# .github/workflows/check-dead-entries.yml
# Separate workflow to inspect all domain names and IP CIDRs for liveness,
# generate detailed reports, and clean up dead entries via PR or direct commit.

name: Check and Cleanup Dead Entries

on:
  schedule:
    # Run once a month at 03:00 UTC on the 1st day of the month
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Resource target to check'
        required: true
        type: choice
        options:
          - all
          - domains
          - ips
        default: all
      action:
        description: 'Action to perform on dead entries'
        required: true
        type: choice
        options:
          - pr
          - commit
          - dry-run
        default: pr
      concurrency:
        description: 'Number of concurrent check tasks'
        required: false
        type: number
        default: 150
      dns_timeout:
        description: 'Timeout for DNS query in seconds'
        required: false
        type: number
        default: 2.0
      ip_timeout:
        description: 'Timeout for IP/CIDR check in seconds'
        required: false
        type: number
        default: 1.5

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-clean:
    name: Check & Clean Dead Entries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          pip install --upgrade dnspython ruff

      - name: Lint Python Code
        run: |
          ruff check .

      - name: Run Dead Entries Checker
        id: checker
        run: |
          set -euo pipefail

          TARGET="${{ inputs.target || 'all' }}"
          ACTION="${{ inputs.action || 'pr' }}"
          CONCURRENCY="${{ inputs.concurrency || 150 }}"
          DNS_TIMEOUT="${{ inputs.dns_timeout || 2.0 }}"
          IP_TIMEOUT="${{ inputs.ip_timeout || 1.5 }}"

          CMD="python3 -m pinrouting check-dead --target $TARGET --concurrency $CONCURRENCY --dns-timeout $DNS_TIMEOUT --ip-timeout $IP_TIMEOUT --output-markdown dead-report.md --output-json dead-report.json"
          if [ "$ACTION" != "dry-run" ]; then
            CMD="$CMD --remove"
          fi

          echo "Running command: $CMD"
          PYTHONPATH=tools $CMD

      - name: Attach Report to Summary
        if: always()
        run: |
          if [ -f dead-report.md ]; then
            cat dead-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dead-entries-report
          path: |
            dead-report.md
            dead-report.json
          if-no-files-found: ignore

      - name: Validate Modified Rulesets
        if: ${{ (inputs.action || 'pr') != 'dry-run' }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain geosite/data/ geoip/)" ]; then
            echo "Changes detected in rulesets. Running linters and regression tests..."
            python3 geosite/buildtools/lint_rules.py --fail-on-error
            PYTHONPATH=tools python3 -m pinrouting lint
            PYTHONPATH=tools python3 -m pinrouting test
          else
            echo "No changes detected in rulesets."
          fi

      - name: Create Pull Request
        if: ${{ (inputs.action || 'pr') == 'pr' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(cleanup): remove dead domains and unrouted IPs"
          branch: cleanup/dead-entries
          delete-branch: true
          title: "🧹 Cleanup dead domains and unresponsive IPs"
          body-path: dead-report.md
          labels: |
            cleanup
            automated

      - name: Direct Commit to Branch
        if: ${{ (inputs.action || 'pr') == 'commit' }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geosite/data/ geoip/
          if ! git diff --cached --quiet; then
            DATE_TAG=$(date -u +%Y%m%d%H%M)
            git commit -m "chore(cleanup): remove dead domains and unrouted IPs [${DATE_TAG}] [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi
