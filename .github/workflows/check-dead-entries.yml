# .github/workflows/check-dead-entries.yml
# Separate workflow to inspect all domain names and IP CIDRs for liveness,
# generate detailed reports, and clean up dead entries via PR or direct commit.

name: Check and Cleanup Dead Entries

on:
  schedule:
    # Run once a month at 03:00 UTC on the 1st day of the month
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Resource target to check'
        required: true
        type: choice
        options:
          - all
          - domains
          - ips
        default: all
      action:
        description: 'Action to perform on dead entries'
        required: true
        type: choice
        options:
          - pr
          - commit
          - dry-run
        default: pr
      concurrency:
        description: 'Number of concurrent check tasks'
        required: false
        type: number
        default: 150
      dns_timeout:
        description: 'Timeout for DNS query in seconds'
        required: false
        type: number
        default: 2.0
      ip_timeout:
        description: 'Timeout for IP/CIDR check in seconds'
        required: false
        type: number
        default: 1.5
      exclude_files:
        description: 'Comma-separated filenames to exclude from checking'
        required: false
        type: string
        default: 'private,CUSTOM-LIST-ADD'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-clean:
    name: Check & Clean Dead Entries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          pip install --upgrade dnspython ruff

      - name: Lint Python Code
        run: |
          ruff check .

      - name: Run Dead Entries Checker
        id: checker
        run: |
          set -euo pipefail

          TARGET="${{ inputs.target || 'all' }}"
          ACTION="${{ inputs.action || 'pr' }}"
          CONCURRENCY="${{ inputs.concurrency || 150 }}"
          DNS_TIMEOUT="${{ inputs.dns_timeout || 2.0 }}"
          IP_TIMEOUT="${{ inputs.ip_timeout || 1.5 }}"
          EXCLUDE_FILES="${{ inputs.exclude_files || 'private,CUSTOM-LIST-ADD' }}"

          CMD="python3 -m pinrouting check-dead --target $TARGET --exclude-files $EXCLUDE_FILES --concurrency $CONCURRENCY --dns-timeout $DNS_TIMEOUT --ip-timeout $IP_TIMEOUT --output-markdown dead-report.md --output-json dead-report.json"
          if [ "$ACTION" != "dry-run" ]; then
            CMD="$CMD --remove"
          fi

          echo "Running command: $CMD"
          PYTHONPATH=tools $CMD

      - name: Attach Report to Summary
        if: always()
        run: |
          if [ -f dead-report.md ]; then
            cat dead-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dead-entries-report
          path: |
            dead-report.md
            dead-report.json
          if-no-files-found: ignore

      - name: Validate Modified Rulesets
        if: ${{ (inputs.action || 'pr') != 'dry-run' }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain geosite/data/ geoip/)" ]; then
            echo "Changes detected in rulesets. Running linters and regression tests..."
            python3 geosite/buildtools/lint_rules.py --fail-on-error
            PYTHONPATH=tools python3 -m pinrouting lint
            PYTHONPATH=tools python3 -m pinrouting test
          else
            echo "No changes detected in rulesets."
          fi

      - name: Publish Cleanup (Pull Request or Branch)
        if: ${{ (inputs.action || 'pr') == 'pr' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain geosite/data/ geoip/)" ]; then
            echo "No changes detected. Nothing to commit or push."
            exit 0
          fi

          BRANCH="cleanup/dead-entries"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add geosite/data/ geoip/
          git commit -m "chore(cleanup): remove dead domains and unrouted IPs"
          git push -f origin "$BRANCH"
          echo "Successfully pushed changes to branch $BRANCH"

          # Attempt creating PR via GitHub CLI
          PR_URL=$(gh pr list --head "$BRANCH" --base "${{ github.ref_name }}" --json url --jq ".[0].url" 2>/dev/null || true)
          if [ -n "$PR_URL" ]; then
            echo "Existing Pull Request found: $PR_URL"
            gh pr edit "$PR_URL" --title "🧹 Cleanup dead domains and unresponsive IPs" --body-file dead-report.md || true
          else
            echo "Attempting to create Pull Request via gh cli..."
            set +e
            PR_OUTPUT=$(gh pr create --base "${{ github.ref_name }}" --head "$BRANCH"               --title "🧹 Cleanup dead domains and unresponsive IPs"               --body-file dead-report.md 2>&1)
            EXIT_CODE=$?
            set -e

            if [ $EXIT_CODE -eq 0 ]; then
              echo "Pull Request created successfully: $PR_OUTPUT"
            else
              echo "::warning ::GitHub Actions does not have permission to create Pull Requests directly. The branch $BRANCH was pushed."
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "> [!WARNING]" >> $GITHUB_STEP_SUMMARY
              echo "> ### ⚠️ Pull Request could not be created automatically" >> $GITHUB_STEP_SUMMARY
              echo "> **GitHub Actions is not permitted to create pull requests in this repository's settings.**" >> $GITHUB_STEP_SUMMARY
              echo "> The cleanup branch \`$BRANCH\` was pushed to the repository." >> $GITHUB_STEP_SUMMARY
              echo "> " >> $GITHUB_STEP_SUMMARY
              echo "> **How to resolve:**" >> $GITHUB_STEP_SUMMARY
              echo "> 1. **To enable automatic PRs in the future:** Go to **Settings ➔ Actions ➔ General ➔ Workflow permissions** and check **"Allow GitHub Actions to create and approve pull requests"**." >> $GITHUB_STEP_SUMMARY
              echo "> 2. **To open the PR now:** [Click here to review and create Pull Request](https://github.com/${{ github.repository }}/compare/${{ github.ref_name }}...${BRANCH}?expand=1)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Direct Commit to Branch
        if: ${{ (inputs.action || 'pr') == 'commit' }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geosite/data/ geoip/
          if ! git diff --cached --quiet; then
            DATE_TAG=$(date -u +%Y%m%d%H%M)
            git commit -m "chore(cleanup): remove dead domains and unrouted IPs [${DATE_TAG}] [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi
