# .github/workflows/build-and-update.yml
# Builds custom geoip.dat and geosite.dat, updates Happ, Incy, and Shadowrocket routing configs,
# publishes release assets with SHA256 checksums, and updates the release branch.

name: Build and Update Routing

on:
  schedule:
    # Run every 24 hours: 01:00 UTC (04:00 MSK / UTC+3)
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'geoip/**'
      - 'geosite/**'
      - 'profiles/**'
      - 'tools/**'
      - '.github/workflows/build-and-update.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CURL: curl -fsSL --retry 5 --retry-delay 3 --connect-timeout 10
  # Upstream builders are pinned: their code runs in a job that can push to this repo.
  # Bump these SHAs deliberately after reviewing upstream changes.
  GEOIP_BUILDER_REF: 424733bd132427dbd505ccc3b8e3ebc427494063       # Loyalsoldier/geoip
  GEOSITE_BUILDER_REF: c6adacf29cc4fb05e04651fcf03e00989ef9f797     # v2fly/domain-list-community

jobs:
  build:
    name: Build & Update Geodata and Routing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Dynamic Build Metadata
      # -----------------------------------------------------------------------
      - name: Generate Build Metadata
        id: meta
        run: |
          set -euo pipefail
          export TZ=UTC
          DAILY_TAG=$(date -u +%Y%m%d%H%M)
          NOW_EPOCH=$(date -u +%s)
          echo "tag=${DAILY_TAG}" >> "$GITHUB_OUTPUT"
          echo "epoch=${NOW_EPOCH}" >> "$GITHUB_OUTPUT"
          echo "Building with tag: ${DAILY_TAG}, epoch: ${NOW_EPOCH}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      # -----------------------------------------------------------------------
      # Lint Python Code
      # -----------------------------------------------------------------------
      - name: Lint Python Code
        run: |
          pip install ruff==0.17.3  # pinned: a new ruff rule must not block the daily geodata release
          ruff check .

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'  # builders need go 1.26 (geoip) and 1.25.12 (v2fly)
          cache: false

      # -----------------------------------------------------------------------
      # Lint Geosite & GeoIP Rules
      # -----------------------------------------------------------------------
      - name: Lint Rulesets and Profiles
        run: |
          PYTHONPATH=tools python3 -m pinrouting lint

      # -----------------------------------------------------------------------
      # Build GeoIP
      # -----------------------------------------------------------------------
      - name: Checkout Loyalsoldier/geoip
        uses: actions/checkout@v7
        with:
          repository: Loyalsoldier/geoip
          ref: ${{ env.GEOIP_BUILDER_REF }}
          path: geoip-builder
          fetch-depth: 1
          persist-credentials: false

      - name: Download GeoIP Inputs
        working-directory: geoip-builder
        run: |
          set -euo pipefail
          mkdir -p downloads
          pids=()
          ${{ env.CURL }} -o whitelist.txt https://raw.githubusercontent.com/escapingworm/russia-whitelist/refs/heads/main/ru-whitelist-cidr.txt & pids+=($!)
          ${{ env.CURL }} -o antifilterdownloadcommunity.txt https://community.antifilter.download/list/community.lst & pids+=($!)
          ${{ env.CURL }} -o refilter.txt https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/ipsum.lst & pids+=($!)
          ${{ env.CURL }} -o refiltercommunity.txt https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/community_ips.lst & pids+=($!)
          ${{ env.CURL }} -o antifilternetwork.txt https://antifilter.network/download/ip.lst & pids+=($!)
          ${{ env.CURL }} -o cdn.lst https://raw.githubusercontent.com/mansourjabin/cdn-ip-database/refs/heads/main/data/cdn.lst & pids+=($!)
          ${{ env.CURL }} -o merged.sum https://raw.githubusercontent.com/PentiumB/CDN-RuleSet/refs/heads/main/release/merged.sum & pids+=($!)
          ${{ env.CURL }} -o downloads/geolite2-ipv4.csv https://github.com/sapics/ip-location-db/releases/download/latest/geolite2-country-ipv4.csv & pids+=($!)
          ${{ env.CURL }} -o downloads/dbip-ipv4.csv https://github.com/sapics/ip-location-db/releases/download/latest/dbip-country-ipv4.csv & pids+=($!)
          ${{ env.CURL }} -o ipinfo_ru.lst https://raw.githubusercontent.com/Davoyan/ipinfo/refs/heads/main/geo/geoip/ru.lst & pids+=($!)
          ${{ env.CURL }} -o ipinfo_by.lst https://raw.githubusercontent.com/Davoyan/ipinfo/refs/heads/main/geo/geoip/by.lst & pids+=($!)
          ${{ env.CURL }} -o downloads/GeoLite2-ASN-CSV.zip https://raw.githubusercontent.com/Loyalsoldier/geoip/refs/heads/release/GeoLite2-ASN-CSV.zip & pids+=($!)

          for pid in "${pids[@]}"; do
            wait "$pid"
          done

          # Every CIDR list must start with a CIDR line and keep at least <min> CIDRs (about half its 10.2026
          # size): an empty, HTML or truncated "remove" list would silently route blocked IPs DIRECT.
          for spec in whitelist.txt:40 antifilterdownloadcommunity.txt:400 refilter.txt:10000 refiltercommunity.txt:5 \
                      antifilternetwork.txt:50000 cdn.lst:1500 merged.sum:9000 ipinfo_ru.lst:30000 ipinfo_by.lst:1000; do
            f=${spec%%:*}; min=${spec#*:}
            first=$(grep -v -m1 -E '^\s*(#|$)' "$f" || true)
            if ! [[ "$first" =~ ^[0-9a-fA-F:.]+/[0-9]+[[:space:]]*$ ]]; then
              echo "::error::Download $f is empty or not a CIDR list (first line: '${first:0:80}')"
              exit 1
            fi
            count=$(grep -c -E '^[0-9a-fA-F:.]+/[0-9]+' "$f" || true)
            if (( count < min )); then
              echo "::error::Download $f has $count CIDRs, expected at least $min (truncated upstream?)"
              exit 1
            fi
          done
          test -s downloads/geolite2-ipv4.csv && test -s downloads/dbip-ipv4.csv

          # Parse GeoLite2 and DB-IP datasets locally for RU & BY
          python3 "${{ github.workspace }}/geoip/buildtools/parse_country_db.py" --input downloads/geolite2-ipv4.csv --prefix geolite_ --countries RU,BY --output-dir .
          python3 "${{ github.workspace }}/geoip/buildtools/parse_country_db.py" --input downloads/dbip-ipv4.csv --prefix dbip_ --countries RU,BY --output-dir .

          test -s geolite_ru.lst && test -s geolite_by.lst
          test -s dbip_ru.lst && test -s dbip_by.lst
          test -s downloads/GeoLite2-ASN-CSV.zip
          unzip -j downloads/GeoLite2-ASN-CSV.zip '*/GeoLite2-ASN-Blocks-*.csv' -d ./geolite2
          rm -rf downloads
          ls -l ./geolite2/

      - name: Overlay Custom GeoIP Config & Lists
        run: |
          set -euo pipefail
          cp -f geoip/*.json geoip-builder/
          cp -f geoip/*.txt  geoip-builder/

      - name: Compile & Run GeoIP Builder
        working-directory: geoip-builder
        run: |
          set -euo pipefail
          go mod download
          go build -o geoip-tool
          rm -rf output
          ./geoip-tool convert -c config.json
          test -s output/dat/geoip.dat
          test -s output/text/direct.txt && test -s output/text/whitelist.txt
          ls -lh output/dat/*.dat

      # -----------------------------------------------------------------------
      # Build Geosite
      # -----------------------------------------------------------------------
      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          ref: ${{ env.GEOSITE_BUILDER_REF }}
          path: geosite-builder
          fetch-depth: 1
          persist-credentials: false

      - name: Compile & Run Geosite Builder
        run: |
          set -euo pipefail
          rm -rf geosite-builder/data /tmp/geosite-out
          mkdir -p geosite-builder/data /tmp/geosite-out
          cp -a ./geosite/data/. geosite-builder/data/

          pushd geosite-builder >/dev/null
          go run ./ -outputdir=/tmp/geosite-out
          popd >/dev/null

          test -s /tmp/geosite-out/dlc.dat
          mkdir -p /tmp/geosite-artifacts
          cp -f /tmp/geosite-out/dlc.dat /tmp/geosite-artifacts/geosite.dat
          ls -lh /tmp/geosite-artifacts/geosite.dat

      # -----------------------------------------------------------------------
      # Package Release Assets
      # -----------------------------------------------------------------------
      - name: Prepare Release Directory
        run: |
          set -euo pipefail
          rm -rf release /tmp/dist
          mkdir -p release/text /tmp/dist

          # GeoIP files
          cp -f geoip-builder/output/dat/geoip.dat release/
          cp -f geoip-builder/output/text/*.txt   release/text/

          # Geosite files
          cp -f /tmp/geosite-artifacts/geosite.dat release/

          # Checksums (pure 64-char hex strings as per INCY / Happ spec)
          (cd release && sha256sum geoip.dat   | awk '{print $1}' > geoip.dat.sha256)
          (cd release && sha256sum geosite.dat | awk '{print $1}' > geosite.dat.sha256)

          # Tarballs for GitHub release
          tar -czf /tmp/dist/text.tar.gz -C release text
          cp -f release/*.dat release/*.dat.sha256 /tmp/dist/

      # -----------------------------------------------------------------------
      # Push to Release Branch (before building configs: they pin this commit)
      # -----------------------------------------------------------------------
      - name: Push to Release Branch
        id: release
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          cd release
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "Release ${TAG}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin release
          # Happ/INCY profiles pin this commit (jsDelivr @<sha> is immutable, @release can stay stale for hours)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # Best effort for people using the @release links from the README; purges are not reliable
          for f in geoip.dat geosite.dat geoip.dat.sha256 geosite.dat.sha256; do
            curl -fsS --retry 3 "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/$f" >/dev/null || true
          done

      # -----------------------------------------------------------------------
      # Build All Client Routing Configs (HAPP, INCY, Shadowrocket) via PinRouting
      # -----------------------------------------------------------------------
      - name: Build PinRouting Client Configurations
        run: |
          set -euo pipefail
          EPOCH="${{ steps.meta.outputs.epoch }}"
          REPO="${{ github.repository }}"

          echo "Building unified client routing configs for repo $REPO with epoch $EPOCH..."
          PYTHONPATH=tools python3 -m pinrouting build --repo "$REPO" --epoch "$EPOCH" \
            --geoip-text-dir geoip-builder/output/text --geodata-ref "${{ steps.release.outputs.sha }}"

      # Tests must run on the freshly generated configs, i.e. exactly what is about to be published
      - name: Run Routing Simulation Tests
        run: |
          PYTHONPATH=tools python3 -m pinrouting test

      # -----------------------------------------------------------------------
      # Commit to main & Push Tag
      # -----------------------------------------------------------------------
      - name: Commit and Push Main Changes
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAPP/ INCY/ SHADOWROCKET/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update routing configs and geodata [${TAG}] [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

          # Tag current commit with DAILY_TAG
          git tag -f "$TAG"
          git push origin "$TAG" --force

      # -----------------------------------------------------------------------
      # Publish Release
      # -----------------------------------------------------------------------
      - name: Publish GitHub Release
        # Pinned like the builders: third-party code in a job that can push to this repo
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "PinRouting Geodata & Rules ${{ steps.meta.outputs.tag }}"
          body: |
            Automated daily release of compiled geo-databases and routing lists.
            - `geoip.dat` & `geoip.dat.sha256`
            - `geosite.dat` & `geosite.dat.sha256`
            - Text CIDR dumps (`text.tar.gz`)
          files: /tmp/dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep only the release just published; --cleanup-tag also deletes the tag of each removed release
      - name: Delete Previous Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName --jq '.[].tagName' \
            | { grep -vxF "$TAG" || true; } \
            | while read -r old; do
                gh release delete "$old" --repo "${{ github.repository }}" --yes --cleanup-tag
                echo "Deleted release and tag $old"
              done
