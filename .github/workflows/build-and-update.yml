name: Build and Update Routing

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'geoip/**'
      - 'geosite/**'
      - 'HAPP/**'
      - 'INCY/**'
      - 'SHADOWROCKET/tools/**'
      - '.github/workflows/build-and-update.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade ruff

      - name: Lint Rules & Configuration
        run: |
          python3 geosite/buildtools/lint_rules.py --fail-on-error

      - name: Run Routing Simulation Tests
        run: |
          python3 geosite/buildtools/test_routing.py

      - name: Set Release Metadata
        id: meta
        run: |
          TAG="$(date -u +'%Y%m%d%H%M')"
          EPOCH="$(date -u +'%s')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "epoch=${EPOCH}" >> "$GITHUB_OUTPUT"
          echo "Build Tag: ${TAG} (Epoch: ${EPOCH})"

      # -----------------------------------------------------------------------
      # Build GeoIP (Standalone with loyalsoldier/geoip)
      # -----------------------------------------------------------------------
      - name: Checkout Loyalsoldier GeoIP Generator
        uses: actions/checkout@v4
        with:
          repository: Loyalsoldier/geoip
          path: geoip-builder

      - name: Prepare GeoIP Configuration and Custom Rules
        run: |
          # Copy custom configs into geoip-builder root
          cp -f geoip/config.json geoip-builder/config.json
          cp -f geoip/CUSTOM-*.txt geoip-builder/

      - name: Download GeoIP Data Sources
        run: |
          cd geoip-builder
          # 1. Re:filter lists
          curl -sSL "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/arm/ipsum_ip_re-filter_arm.lst" -o refilter-ipsum.txt
          curl -sSL "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/arm/community_ip_re-filter_arm.lst" -o refilter-community.txt

          # 2. Antifilter Network & Community
          curl -sSL "https://antifilter.network/download/ip.lst" -o antifilter-network.txt
          curl -sSL "https://community.antifilter.download/list/community.lst" -o antifilter-community.txt

          # 3. Global CDNs & Hostings
          curl -sSL "https://raw.githubusercontent.com/PentiumB/CDN-RuleSet/main/cidr/all_cdn.txt" -o pentiumb-cdn.txt
          curl -sSL "https://raw.githubusercontent.com/mansourjabin/cdn-ip-database/main/all_cdn_ip.txt" -o mansourjabin-cdn.txt
          curl -sSL "https://raw.githubusercontent.com/ip-location-db/asn-ip-database/refs/heads/main/asn-ip-ranges.csv" -o asn-ip-ranges.csv
          curl -sSL "https://zerocdn.com/zerocdn-ipv4.txt" -o zerocdn.txt

          # 4. IPinfo Lite (RU & BY)
          curl -sSL "https://raw.githubusercontent.com/Davoyan/ipinfo/main/country_asn/RU.txt" -o ipinfo-ru.txt
          curl -sSL "https://raw.githubusercontent.com/Davoyan/ipinfo/main/country_asn/BY.txt" -o ipinfo-by.txt

          # 5. DB-IP Lite & MaxMind GeoLite2 ASN (via parse_country_db.py)
          curl -sSL "https://raw.githubusercontent.com/ip-location-db/dbip-country-lite/refs/heads/main/dbip-country-lite.csv" -o dbip-country-lite.csv
          curl -sSL "https://dl.netsyms.net/dbs/geolite2/GeoLite2-ASN-CSV.zip" -o GeoLite2-ASN-CSV.zip
          unzip -q GeoLite2-ASN-CSV.zip

          # Parse DB-IP & GeoLite2 ASN directly from source CSVs
          python3 ../geoip/buildtools/parse_country_db.py

          # Verify downloaded sources
          wc -l *.txt

      - name: Compile GeoIP
        run: |
          cd geoip-builder
          go run ./ --country --text
          ls -lh output/dat/geoip.dat output/text/

      # -----------------------------------------------------------------------
      # Build Geosite (Standalone with v2fly/domain-list-community)
      # -----------------------------------------------------------------------
      - name: Build Geosite Compiler
        run: |
          mkdir -p /tmp/dlc-repo
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git /tmp/dlc-repo
          cd /tmp/dlc-repo
          go build -v -o /tmp/dlc-bin .

      - name: Compile Geosite
        run: |
          mkdir -p /tmp/geosite-out
          /tmp/dlc-bin --datapath geosite/data --outputdir /tmp/geosite-out
          test -s /tmp/geosite-out/dlc.dat
          mkdir -p /tmp/geosite-artifacts
          cp -f /tmp/geosite-out/dlc.dat /tmp/geosite-artifacts/geosite.dat
          ls -lh /tmp/geosite-artifacts/geosite.dat

      # -----------------------------------------------------------------------
      # Package Release Assets
      # -----------------------------------------------------------------------
      - name: Prepare Release Directory
        run: |
          set -euo pipefail
          rm -rf release /tmp/dist
          mkdir -p release/text /tmp/dist

          # GeoIP files
          cp -f geoip-builder/output/dat/geoip.dat release/
          cp -f geoip-builder/output/text/*.txt   release/text/

          # Geosite files
          cp -f /tmp/geosite-artifacts/geosite.dat release/

          # Checksums (pure 64-char hex strings as per INCY / Happ spec)
          (cd release && sha256sum geoip.dat   | awk '{print $1}' > geoip.dat.sha256)
          (cd release && sha256sum geosite.dat | awk '{print $1}' > geosite.dat.sha256)

          # Tarballs for GitHub release
          tar -czf /tmp/dist/text.tar.gz -C release text
          cp -f release/*.dat release/*.dat.sha256 /tmp/dist/

      # -----------------------------------------------------------------------
      # Update HAPP & INCY Configs
      # -----------------------------------------------------------------------
      - name: Update HAPP and INCY Configs
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          EPOCH="${{ steps.meta.outputs.epoch }}"
          REPO="${{ github.repository }}"

          GEOIP_URL="https://cdn.jsdelivr.net/gh/${REPO}@release/geoip.dat"
          GEOSITE_URL="https://cdn.jsdelivr.net/gh/${REPO}@release/geosite.dat"

          echo "Updating configs to:"
          echo "  GeoIP:   $GEOIP_URL"
          echo "  Geosite: $GEOSITE_URL"
          echo "  Epoch:   $EPOCH"

          for type in DEFAULT WHITELIST BASIC; do
            file="HAPP/${type}.JSON"
            tmp="$(mktemp)"
            jq \
              --arg ts "$EPOCH" \
              --arg geoip "$GEOIP_URL" \
              --arg geosite "$GEOSITE_URL" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              "$file" > "$tmp"
            mv "$tmp" "$file"
          done

          echo "Mirroring HAPP configs to INCY..."
          cp HAPP/*.JSON INCY/

          echo "Generating Deeplinks and Autorouting Links..."
          for type in DEFAULT WHITELIST BASIC; do
            happ_b64="$(jq -c . "HAPP/${type}.JSON" | tr -d '\r\n' | base64 | tr -d '\r\n')"
            printf 'happ://routing/onadd/%s\n' "$happ_b64" > "HAPP/${type}.DEEPLINK"

            incy_b64="$(jq -c . "INCY/${type}.JSON" | tr -d '\r\n' | base64 | tr -d '\r\n')"
            printf 'incy://routing/onadd/%s\n' "$incy_b64" > "INCY/${type}.DEEPLINK"
            printf 'incy://autorouting/onadd/https://raw.githubusercontent.com/%s/main/INCY/%s.JSON\n' "$REPO" "$type" > "INCY/${type}.AUTOLINK"
          done

      # -----------------------------------------------------------------------
      # Build Shadowrocket Configs & Rules
      # -----------------------------------------------------------------------
      - name: Build Shadowrocket Configs and Rules
        run: |
          set -euo pipefail
          EPOCH="${{ steps.meta.outputs.epoch }}"
          REPO="${{ github.repository }}"
          python3 SHADOWROCKET/tools/build_shadowrocket.py --repo "$REPO" --epoch "$EPOCH"

      # -----------------------------------------------------------------------
      # Commit to main & Push Tag
      # -----------------------------------------------------------------------
      - name: Commit and Push Main Changes
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAPP/ INCY/ SHADOWROCKET/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update routing configs and geodata [${TAG}] [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

          # Tag current commit with DAILY_TAG
          git tag -f "$TAG"
          git push origin "$TAG" --force

      # -----------------------------------------------------------------------
      # Push to Release Branch & Publish Release
      # -----------------------------------------------------------------------
      - name: Push to Release Branch
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          cd release
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "Release ${TAG}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f -u origin release
          cd ..

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"

          echo "Publishing release for tag ${TAG}..."
          for i in 1 2 3; do
            if gh release create "${TAG}" /tmp/dist/* --title "${TAG}" --notes "Automated release ${TAG}"; then
              echo "Release published successfully!"
              exit 0
            fi
            echo "Retry $i failed, waiting 5 seconds..."
            sleep 5
          done
          echo "Failed to create release after 3 attempts."
          exit 1

      # -----------------------------------------------------------------------
      # Purge jsDelivr CDN Cache
      # -----------------------------------------------------------------------
      - name: Purge jsDelivr Cache
        continue-on-error: true
        run: |
          REPO="${{ github.repository }}"
          echo "Purging jsDelivr CDN cache for ${REPO}@release..."
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@release/geoip.dat" || true
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@release/geosite.dat" || true
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@release/geoip.dat.sha256" || true
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@release/geosite.dat.sha256" || true
          echo "Purge request completed."
