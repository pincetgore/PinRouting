name: Build and Update Routing

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches:
      - main
    paths:
      - "geoip/**"
      - "geosite/data/**"
      - "HAPP/*.JSON"
      - "INCY/*.JSON"
      - "SHADOWROCKET/tools/**"
      - ".github/workflows/build-and-update.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    env:
      CURL: "curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused"

    steps:
      - name: Checkout PinRouting
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate configs
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating JSON files..."
          jq empty HAPP/*.JSON INCY/*.JSON
          echo "All configs valid!"

      - name: Set Tag & Timestamps
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC
          DAILY_TAG=$(date -u +%Y%m%d%H%M)
          NOW_EPOCH=$(date -u +%s)
          echo "tag=${DAILY_TAG}" >> "$GITHUB_OUTPUT"
          echo "epoch=${NOW_EPOCH}" >> "$GITHUB_OUTPUT"
          echo "Building with tag: ${DAILY_TAG}, epoch: ${NOW_EPOCH}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.21'
          cache: false

      # -----------------------------------------------------------------------
      # Lint Geosite & GeoIP Rules
      # -----------------------------------------------------------------------
      - name: Lint Rulesets
        run: |
          python3 geosite/buildtools/lint_rules.py --fail-on-error

      # -----------------------------------------------------------------------
      # Build GeoIP
      # -----------------------------------------------------------------------
      - name: Checkout Loyalsoldier/geoip
        uses: actions/checkout@v7
        with:
          repository: Loyalsoldier/geoip
          path: geoip-builder
          fetch-depth: 1

      - name: Download GeoIP Inputs
        working-directory: geoip-builder
        run: |
          set -euo pipefail
          mkdir -p downloads
          pids=()
          ${{ env.CURL }} -o whitelist.txt https://raw.githubusercontent.com/escapingworm/russia-whitelist/refs/heads/main/ru-whitelist-cidr.txt & pids+=($!)
          ${{ env.CURL }} -o antifilterdownloadcommunity.txt https://community.antifilter.download/list/community.lst & pids+=($!)
          ${{ env.CURL }} -o refilter.txt https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/ipsum.lst & pids+=($!)
          ${{ env.CURL }} -o refiltercommunity.txt https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/community_ips.lst & pids+=($!)
          ${{ env.CURL }} -o antifilternetwork.txt https://antifilter.network/download/ip.lst & pids+=($!)
          ${{ env.CURL }} -o cdn.lst https://raw.githubusercontent.com/mansourjabin/cdn-ip-database/refs/heads/main/data/cdn.lst & pids+=($!)
          ${{ env.CURL }} -o merged.sum https://raw.githubusercontent.com/PentiumB/CDN-RuleSet/refs/heads/main/release/merged.sum & pids+=($!)
          ${{ env.CURL }} -o downloads/geolite2-ipv4.csv https://github.com/sapics/ip-location-db/releases/download/latest/geolite2-country-ipv4.csv & pids+=($!)
          ${{ env.CURL }} -o downloads/dbip-ipv4.csv https://github.com/sapics/ip-location-db/releases/download/latest/dbip-country-ipv4.csv & pids+=($!)
          ${{ env.CURL }} -o ipinfo_ru.lst https://raw.githubusercontent.com/Davoyan/ipinfo/refs/heads/main/geo/geoip/ru.lst & pids+=($!)
          ${{ env.CURL }} -o ipinfo_by.lst https://raw.githubusercontent.com/Davoyan/ipinfo/refs/heads/main/geo/geoip/by.lst & pids+=($!)
          ${{ env.CURL }} -o downloads/GeoLite2-ASN-CSV.zip https://dl.netsyms.net/dbs/geolite2/GeoLite2-ASN-CSV.zip & pids+=($!)

          for pid in "${pids[@]}"; do
            wait "$pid"
          done

          # Parse GeoLite2 and DB-IP datasets locally for RU & BY
          python3 "${{ github.workspace }}/geoip/buildtools/parse_country_db.py" --input downloads/geolite2-ipv4.csv --prefix geolite_ --countries RU,BY --output-dir .
          python3 "${{ github.workspace }}/geoip/buildtools/parse_country_db.py" --input downloads/dbip-ipv4.csv --prefix dbip_ --countries RU,BY --output-dir .

          test -s geolite_ru.lst && test -s geolite_by.lst
          test -s dbip_ru.lst && test -s dbip_by.lst
          test -s downloads/GeoLite2-ASN-CSV.zip
          unzip -j downloads/GeoLite2-ASN-CSV.zip '*/GeoLite2-ASN-Blocks-*.csv' -d ./geolite2
          rm -rf downloads
          ls -l ./geolite2/

      - name: Overlay Custom GeoIP Config & Lists
        run: |
          set -euo pipefail
          cp -f geoip/*.json geoip-builder/
          cp -f geoip/*.txt  geoip-builder/

      - name: Compile & Run GeoIP Builder
        working-directory: geoip-builder
        run: |
          set -euo pipefail
          go mod download
          go build -o geoip-tool
          rm -rf output
          ./geoip-tool convert -c config.json
          test -s output/dat/geoip.dat
          ls -lh output/dat/*.dat

      # -----------------------------------------------------------------------
      # Build Geosite
      # -----------------------------------------------------------------------
      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: geosite-builder
          fetch-depth: 1

      - name: Compile & Run Geosite Builder
        run: |
          set -euo pipefail
          rm -rf geosite-builder/data /tmp/geosite-out
          mkdir -p geosite-builder/data /tmp/geosite-out
          cp -a ./geosite/data/. geosite-builder/data/

          pushd geosite-builder >/dev/null
          go run ./ -outputdir=/tmp/geosite-out
          popd >/dev/null

          test -s /tmp/geosite-out/dlc.dat
          mkdir -p /tmp/geosite-artifacts
          cp -f /tmp/geosite-out/dlc.dat /tmp/geosite-artifacts/geosite.dat
          ls -lh /tmp/geosite-artifacts/geosite.dat

      # -----------------------------------------------------------------------
      # Package Release Assets
      # -----------------------------------------------------------------------
      - name: Prepare Release Directory
        run: |
          set -euo pipefail
          rm -rf release /tmp/dist
          mkdir -p release/text /tmp/dist

          # GeoIP files
          cp -f geoip-builder/output/dat/geoip.dat release/
          cp -f geoip-builder/output/text/*.txt   release/text/

          # Geosite files
          cp -f /tmp/geosite-artifacts/geosite.dat release/

          # Checksums (relative filenames for sha256sum -c convenience)
          (cd release && sha256sum geoip.dat   > geoip.dat.sha256)
          (cd release && sha256sum geosite.dat > geosite.dat.sha256)

          # Tarballs for GitHub release
          tar -czf /tmp/dist/text.tar.gz -C release text
          cp -f release/*.dat release/*.dat.sha256 /tmp/dist/

      # -----------------------------------------------------------------------
      # Update HAPP & INCY Configs
      # -----------------------------------------------------------------------
      - name: Update HAPP and INCY Configs
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          EPOCH="${{ steps.meta.outputs.epoch }}"
          REPO="${{ github.repository }}"

          GEOIP_URL="https://cdn.jsdelivr.net/gh/${REPO}@release/geoip.dat"
          GEOSITE_URL="https://cdn.jsdelivr.net/gh/${REPO}@release/geosite.dat"

          echo "Updating configs to:"
          echo "  GeoIP:   $GEOIP_URL"
          echo "  Geosite: $GEOSITE_URL"
          echo "  Epoch:   $EPOCH"

          for type in DEFAULT WHITELIST BASIC; do
            file="HAPP/${type}.JSON"
            tmp="$(mktemp)"
            jq \
              --arg ts "$EPOCH" \
              --arg geoip "$GEOIP_URL" \
              --arg geosite "$GEOSITE_URL" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              "$file" > "$tmp"
            mv "$tmp" "$file"
          done

          echo "Mirroring HAPP configs to INCY..."
          cp HAPP/*.JSON INCY/

          echo "Generating Deeplinks..."
          for type in DEFAULT WHITELIST BASIC; do
            happ_b64="$(jq -c . "HAPP/${type}.JSON" | tr -d '\r\n' | base64 | tr -d '\r\n')"
            printf 'happ://routing/onadd/%s\n' "$happ_b64" > "HAPP/${type}.DEEPLINK"

            incy_b64="$(jq -c . "INCY/${type}.JSON" | tr -d '\r\n' | base64 | tr -d '\r\n')"
            printf 'incy://routing/onadd/%s\n' "$incy_b64" > "INCY/${type}.DEEPLINK"
          done

      # -----------------------------------------------------------------------
      # Build Shadowrocket Configs & Rules
      # -----------------------------------------------------------------------
      - name: Build Shadowrocket Configs and Rules
        run: |
          set -euo pipefail
          EPOCH="${{ steps.meta.outputs.epoch }}"
          REPO="${{ github.repository }}"
          python3 SHADOWROCKET/tools/build_shadowrocket.py --repo "$REPO" --epoch "$EPOCH"

      # -----------------------------------------------------------------------
      # Commit to main & Push Tag
      # -----------------------------------------------------------------------
      - name: Commit and Push Main Changes
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAPP/ INCY/ SHADOWROCKET/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update routing configs and geodata [${TAG}] [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

          # Tag current commit with DAILY_TAG
          git tag -f "$TAG"
          git push origin "$TAG" --force

      # -----------------------------------------------------------------------
      # Push to Release Branch & Publish Release
      # -----------------------------------------------------------------------
      - name: Push to Release Branch
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          cd release
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "Release ${TAG}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f -u origin release
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: false
          draft: false
          files: /tmp/dist/*

      # -----------------------------------------------------------------------
      # Keep Only Latest Release & Tag
      # -----------------------------------------------------------------------
      - name: Delete Older Releases and Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ steps.meta.outputs.tag }}"
          echo "Keeping current release and tag: ${CURRENT_TAG}"

          # Delete all older releases and their associated tags
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$CURRENT_TAG" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --cleanup-tag -y || true
            fi
          done

          # Clean up any remaining dangling remote tags
          git ls-remote --tags origin | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '\^{}' | while read -r rtag; do
            if [ -n "$rtag" ] && [ "$rtag" != "$CURRENT_TAG" ]; then
              echo "Deleting dangling remote tag: $rtag"
              git push origin --delete "$rtag" || true
            fi
          done

      # -----------------------------------------------------------------------
      # Purge jsDelivr Cache
      # -----------------------------------------------------------------------
      - name: Purge jsDelivr CDN Cache
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          for f in geoip.dat geoip.dat.sha256 geosite.dat geosite.dat.sha256; do
            if ! curl -fsSL -i "https://purge.jsdelivr.net/gh/${REPO}@release/${f}" > /dev/null; then
              echo "::warning ::Failed to purge ${f} from jsDelivr cache"
            fi
          done
