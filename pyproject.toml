[project]
name = "pinrouting"
version = "1.0.0"
description = "Routing configs and rulesets generator for Happ, INCY, and Shadowrocket"
requires-python = ">=3.15"
dependencies = [
    "dnspython>=2.6.1",
]

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.pyright]
pythonVersion = "3.15"
typeCheckingMode = "standard"
